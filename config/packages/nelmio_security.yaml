nelmio_security:
    # Empêche l'inclusion du site dans une iframe (anti-clickjacking, §16.2).
    clickjacking:
        paths:
            '^/.*': DENY

    # Désactive le "MIME sniffing" (X-Content-Type-Options: nosniff).
    content_type:
        nosniff: true

    # Referrer-Policy : URL complète en same-origin, origine seule en HTTPS->HTTPS, rien en HTTPS->HTTP.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Content-Security-Policy (§16.2). Mode "enforce".
    # 'unsafe-inline' (script/style) est TEMPORAIRE : l'importmap AssetMapper, le petit
    # script `.js` de base.html.twig, les nombreux styles inline et les écrans /app autonomes
    # en dépendent. XSS déjà couvert par l'auto-échappement Twig + aucun HTML utilisateur.
    # Dérogation §16.2 déclarée en ADAPTATIONS ; cible : nonces + externalisation → retrait d'unsafe-inline.
    csp:
        enabled: true
        enforce:
            default-src:
                - 'self'
            script-src:
                - 'self'
                - 'unsafe-inline'
            style-src:
                - 'self'
                - 'unsafe-inline'
            img-src:
                - 'self'
                - 'data:'
            font-src:
                - 'self'
            connect-src:
                - 'self'
            form-action:
                - 'self'
            base-uri:
                - 'self'
            object-src:
                - 'none'
            frame-ancestors:
                - 'none'

# HSTS uniquement en production : sur localhost, HSTS forcerait TOUT localhost en HTTPS
# (ignorant le port) et casserait les serveurs de dev en http (ex. aperçu maquette :8100).
when@prod:
    nelmio_security:
        forced_ssl:
            enabled: true
            hsts_max_age: 31536000
            hsts_subdomains: true
            hsts_preload: false
            redirect_status_code: 301
