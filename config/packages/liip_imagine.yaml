# Génération d'images responsives / formats modernes (§8.2).
# Pilote GD (ajouté à l'image Docker) ; source = dossier public/.
# NB : les assets de MARQUE one-shot (og:image, logo JSON-LD) sont des fichiers
# statiques optimisés (`raf360-og.jpg`, `raf360-logo.png`) — LiipImagine n'est PAS
# adapté à eux (conversion de format = extension d'URL incohérente pour les scrapers,
# et le PNG GD compresse mal). LiipImagine sert les IMAGES DE CONTENU responsives :
# les jeux `content_*` produisent du WebP redimensionné (blog, équipe, uploads). Usage :
#   <img src="{{ 'chemin.jpg'|imagine_filter('content_md') }}" width=".." height=".." loading="lazy">
# ou <picture> avec plusieurs <source srcset> pointant sur content_sm/md/lg.
liip_imagine:
    driver: gd
    loaders:
        default:
            filesystem:
                data_root: "%kernel.project_dir%/public"
    resolvers:
        default:
            web_path:
                cache_prefix: media/cache
    filter_sets:
        # --- Jeux responsives pour images de contenu (WebP), prêts à l'emploi ---
        content_lg:
            format: webp
            quality: 78
            filters:
                thumbnail: { size: [1200, 1200], mode: inset, allow_upscale: false }
        content_md:
            format: webp
            quality: 78
            filters:
                thumbnail: { size: [768, 768], mode: inset, allow_upscale: false }
        content_sm:
            format: webp
            quality: 78
            filters:
                thumbnail: { size: [400, 400], mode: inset, allow_upscale: false }
