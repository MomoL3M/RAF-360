security:
    # Hachage des mots de passe en Argon2id via libsodium (§16.1).
    # NB : « auto » retiendrait bcrypt ; on force donc explicitement Argon2id.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium

    # Fournisseur d'utilisateurs : entité Doctrine, identifiant = e-mail.
    providers:
        app_utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_utilisateurs
            form_login:
                login_path: connexion
                check_path: connexion
                enable_csrf: true
                default_target_path: app_accueil
            logout:
                path: deconnexion
                target: connexion
            # Limitation des tentatives de connexion (anti credential-stuffing, §16.1).
            login_throttling:
                max_attempts: 5

    role_hierarchy:
        ROLE_COLLABORATEUR: [ROLE_USER]
        ROLE_DIRIGEANT: [ROLE_COLLABORATEUR]
        ROLE_EXPERT_COMPTABLE: [ROLE_USER]
        ROLE_AVOCAT: [ROLE_USER]
        ROLE_ADMIN: [ROLE_DIRIGEANT, ROLE_EXPERT_COMPTABLE, ROLE_AVOCAT]

    # Seule la première règle correspondante s'applique.
    access_control:
        - { path: ^/app, roles: ROLE_USER }
        # L'onboarding configure l'entreprise d'un utilisateur connecté (plus d'accès sans mot de passe).
        - { path: ^/onboarding, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coûts réduits en test pour accélérer (jamais en production).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
