framework:
    rate_limiter:
        # Anti-abus des formulaires publics (contact, diagnostic) — §13.1 / §16.
        lead_form:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # Anti-abus du collecteur d'erreurs front (§4.5) — plafond généreux mais borné.
        client_error:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
