<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAF 360 — Maquette</title>
<style>
  :root{
    --navy:#1E2761; --navy2:#2C3A7A; --blue:#3B6FB6; --ice:#CADCFC; --iceb:#9CC2F0;
    --gold:#E4B95B; --green:#2FA37C; --red:#C0503F; --redl:#FCE9E5;
    --ink:#1A2238; --slate:#5B6480; --bg:#F4F7FC; --card:#FFFFFF; --line:#DCE4F2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
  button{font-family:inherit;cursor:pointer}
  .serif{font-family:Georgia,'Times New Roman',serif}

  /* logo */
  .logo{display:flex;align-items:center;gap:11px}
  .logo .txt{line-height:1}
  .logo .daf{font-family:Georgia,serif;font-weight:800;color:var(--navy);letter-spacing:1px}
  .logo .num{color:var(--iceb);letter-spacing:2px;margin-top:2px;font-weight:700}

  /* buttons */
  .btn{border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;border:none;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-accent{background:var(--gold);color:var(--ink)}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
  .btn-sm{padding:7px 14px;font-size:13px}
  .btn-xs{padding:5px 11px;font-size:12px;border-radius:7px}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(30,39,97,.04);transition:all .15s ease}
  .card.clickable{cursor:pointer}
  .card.clickable:hover{box-shadow:0 6px 20px rgba(30,39,97,.10);transform:translateY(-2px)}

  h2.section{font-family:Georgia,serif;font-size:24px;color:var(--navy);font-weight:700}
  .section-sub{color:var(--slate);font-size:14px;margin-top:6px}

  input.field,select.field{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff}
  input.field:focus{border-color:var(--navy)}

  /* layout */
  .shell{display:flex;min-height:100vh}
  aside{width:244px;background:#fff;border-right:1px solid var(--line);padding:24px 0;flex-shrink:0}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 24px;cursor:pointer;color:var(--slate);border-left:3px solid transparent;font-weight:500;font-size:14px}
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{color:var(--navy);background:rgba(202,220,252,.27);border-left:3px solid var(--navy);font-weight:600}
  .nav-item svg{flex-shrink:0}
  header.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  main{padding:32px;flex:1}
  .avatar{width:34px;height:34px;border-radius:20px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}

  .grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .hidden{display:none}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .dot{width:10px;height:10px;border-radius:10px;display:inline-block}

  /* AI copilot signature */
  .ai{position:relative;border-radius:12px;padding:16px 18px 16px 20px;background:#fff;border:1px solid var(--line);overflow:hidden}
  .ai::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sev,var(--navy))}
  .ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--sev,var(--navy))}
  .ai-title{font-size:14px;font-weight:700;color:var(--ink);margin:7px 0 4px}
  .ai-body{font-size:13px;color:var(--slate);line-height:1.55}
  .scn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .scn-col{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
  .scn-h{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px}
  .scn-li{display:flex;gap:7px;font-size:12px;color:var(--slate);margin:5px 0;line-height:1.4}
  .scn-li b{font-weight:700}
  .tree-row{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
  .tree-row:hover{background:var(--bg)}
  .tree-child{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;padding:11px 16px 11px 46px;font-size:13.5px;align-items:center;border-bottom:1px solid var(--line);background:#fbfcfe}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:#fff}

  #cashTip{position:fixed;z-index:60;pointer-events:none;background:var(--navy);color:#fff;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.5;box-shadow:0 6px 18px rgba(30,39,97,.25);display:none;min-width:150px}
  #cashTip b{color:var(--ice)}
  .slot{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer}
  .slot:hover{border-color:var(--navy);background:var(--bg)}
  .slot.sel{background:var(--navy);color:#fff;border-color:var(--navy)}

  @media(max-width:760px){
    aside{position:fixed;z-index:20;height:100%;transform:translateX(-100%);transition:transform .2s}
    aside.open{transform:none}
    .grid-2{grid-template-columns:1fr!important}
    .scn{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="cashTip"></div>

<script>
const C={navy:"#1E2761",navy2:"#2C3A7A",blue:"#3B6FB6",ice:"#CADCFC",iceb:"#9CC2F0",gold:"#E4B95B",green:"#2FA37C",red:"#C0503F",redl:"#FCE9E5",ink:"#1A2238",slate:"#5B6480",bg:"#F4F7FC",card:"#FFFFFF",line:"#DCE4F2"};
const TODAY="2026-02-10"; /* date de référence de la démo */

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function badge(txt,color){color=color||C.slate;return `<span class="badge" style="color:${color};background:${color}1A">${esc(txt)}</span>`;}
function sectionTitle(t,sub){return `<div style="margin-bottom:18px"><h2 class="section">${esc(t)}</h2>${sub?`<p class="section-sub">${esc(sub)}</p>`:""}</div>`;}
function donut(pct,size,color){size=size||90;color=color||C.gold;const r=size/2-8,c=2*Math.PI*r;
 return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${C.line}" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dy="6" font-size="20" font-weight="700" fill="${C.navy}">${pct}%</text></svg>`;}
function spark(pts,w,h,color){w=w||220;h=h||54;color=color||C.navy;
 const max=Math.max(...pts),min=Math.min(...pts),rng=(max-min)||1,step=w/(pts.length-1);
 const p=pts.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/rng)*(h-10)-5).toFixed(1)}`).join(" ");
 return `<svg width="${w}" height="${h}" style="display:block"><polygon points="0,${h} ${p} ${w},${h}" fill="${color}14"/><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

/* nouveau logo : double flèche 360° + wordmark */
function logo(size){size=size||36;const s=size;return `
 <div class="logo">
  <svg width="${s}" height="${s}" viewBox="0 0 120 120" fill="none" aria-label="DAF 360">
   <defs>
    <linearGradient id="lgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12224E"/><stop offset="1" stop-color="#2C6FB0"/></linearGradient>
    <linearGradient id="lgL" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B94D6"/><stop offset="1" stop-color="#A9CBF2"/></linearGradient>
   </defs>
   <path d="M28 74 A34 34 0 0 1 92 72" stroke="url(#lgD)" stroke-width="10" fill="none" stroke-linecap="round"/>
   <polygon points="86,60 101,73 84,84" fill="#1A3E7A"/>
   <path d="M92 66 A34 34 0 0 1 28 68" stroke="url(#lgL)" stroke-width="10" fill="none" stroke-linecap="round"/>
   <polygon points="34,56 19,67 36,80" fill="#8FBBEE"/>
  </svg>
  <div class="txt"><div class="daf" style="font-size:${s*0.5}px">DAF</div><div class="num" style="font-size:${s*0.26}px">360°</div></div>
 </div>`;}

/* AI copilot component (élément signature, répété sur tous les écrans) */
function ai(o){
 const sev=o.sev||C.navy;
 const kind=o.kind||"Anticipation";
 return `<div class="ai" style="--sev:${sev};${o.style||""}">
  <div class="ai-tag" style="--sev:${sev}">${sparkSvg(sev)} Copilote DAF 360 · ${esc(kind)}</div>
  <div class="ai-title">${esc(o.title)}</div>
  <div class="ai-body">${o.body}</div>
  ${o.scenarios?scenarios(o.scenarios,o.reco):""}
  ${o.cta?`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${o.cta.map(c=>`<button class="btn ${c.p?"btn-primary":"btn-ghost"} btn-xs" onclick="${c.act||"noop()"}">${esc(c.t)}</button>`).join("")}</div>`:""}
  ${o.src?`<div style="font-size:11px;color:${C.slate};margin-top:10px;border-top:1px solid ${C.line};padding-top:8px">${esc(o.src)}</div>`:""}
 </div>`;}
function sparkSvg(c){c=c||C.navy;return `<svg width="13" height="13" viewBox="0 0 24 24" fill="${c}"><path d="M12 2l1.9 5.6L19.5 9.5 13.9 11.4 12 17 10.1 11.4 4.5 9.5 10.1 7.6z"/></svg>`;}
function scenarios(list,reco){return `<div class="scn">${list.map(s=>`<div class="scn-col"><div class="scn-h">${esc(s.h)}</div>
  ${(s.pro||[]).map(p=>`<div class="scn-li"><span style="color:${C.green};font-weight:800">✓</span><span>${esc(p)}</span></div>`).join("")}
  ${(s.con||[]).map(p=>`<div class="scn-li"><span style="color:${C.red};font-weight:800">✗</span><span>${esc(p)}</span></div>`).join("")}
 </div>`).join("")}</div>${reco?`<div style="margin-top:9px;font-size:12.5px;color:${C.navy};background:${C.ice}44;padding:8px 11px;border-radius:8px"><b>Recommandation du copilote :</b> ${esc(reco)}</div>`:""}`;}

/* nav icons (SVG descriptifs, currentColor) */
const ICONS={
 dash:'<path d="M4 13a8 8 0 0 1 16 0" /><path d="M12 13l3.5-3.5"/><circle cx="12" cy="13" r="1.2" fill="currentColor" stroke="none"/>',
 actions:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6v2.5H9z"/><path d="M8.5 12l2 2 3.5-3.5"/>',
 calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/><path d="M8.5 13h2M13.5 13h2M8.5 16.5h2"/>',
 cash:'<path d="M4 19h16"/><path d="M4 16l4-4 3 2 5-6"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><path d="M17.5 20v-1M6.5 20v-2"/>',
 docs:'<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
 factures:'<path d="M7 3h7l4 4v13l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2L7 20z"/><path d="M13 3v5h5"/><path d="M9.5 12h5M9.5 15h3"/>',
 dataroom:'<path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9.2 11.5l2 2 3.6-3.6"/>',
 assistant:'<path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4z"/><path d="M18 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>'
};
function nicon(id){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[id]||""}</svg>`;}

/* ---------- data ---------- */
const NAV=[
 {id:"dash",label:"Tableau de bord"},{id:"actions",label:"Centre d'actions"},
 {id:"calendar",label:"Calendrier"},{id:"cash",label:"Trésorerie"},
 {id:"docs",label:"Documents"},{id:"factures",label:"Factures"},
 {id:"dataroom",label:"Data room"},{id:"assistant",label:"Assistant IA"}];

const statutColor={"À faire":C.slate,"À valider":C.gold,"En retard":C.red,"risque":C.red,"confirmer":C.gold,"escalade":C.navy2,"attente":C.slate};
const statutLabel={risque:"Risque élevé",confirmer:"À confirmer",escalade:"Escalade avocat",attente:"En attente"};

/* échéances avec dates ISO (tri) + montants (estimatif/réel) */
const ECHEANCES=[
 {t:"TVA (CA3) — Décembre",iso:"2026-01-24",statut:"En retard",prio:"Haute",montant:"3 420 €",mt:"réel"},
 {t:"Déclaration TVA (CA3) — Janvier",iso:"2026-02-12",statut:"À faire",prio:"Haute",montant:"3 980 €",mt:"estimatif"},
 {t:"Renouvellement bail commercial",iso:"2026-02-20",statut:"À valider",prio:"Moyenne"},
 {t:"1er acompte d'IS",iso:"2026-03-15",statut:"À faire",prio:"Moyenne",montant:"4 250 €",mt:"estimatif"},
 {t:"DSN mensuelle — Février",iso:"2026-03-15",statut:"À faire",prio:"Haute"},
 {t:"Approbation des comptes annuels",iso:"2026-06-30",statut:"À faire",prio:"Basse"}
].sort((a,b)=>a.iso.localeCompare(b.iso));
const isOverdue=iso=>iso<TODAY;
function frDate(iso){const m=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];const d=iso.split("-");return `${(+d[2])} ${m[+d[1]-1]}`;}

const ACTIONS=[
 {t:"3 pièces manquantes pour la clôture TVA",statut:"risque",who:"Vous"},
 {t:"Facture fournisseur ACME en doublon détecté",statut:"confirmer",who:"Compta"},
 {t:"Contrat client BÉTA : clause de responsabilité à revoir",statut:"escalade",who:"Avocat"},
 {t:"Rapprochement bancaire de janvier à valider",statut:"attente",who:"DAF"}];

/* trésorerie : 12 mois, réalisé puis prévisionnel */
const CASH={
 lab:["Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc","Jan","Fév"],
 yr:["25","25","25","25","25","25","25","25","25","25","26","26"],
 ent:[48,52,60,55,58,62,70,66,72,68,74,80],
 sor:[42,45,50,48,52,49,55,53,58,90,95,92],
 sol:[46,53,63,70,76,89,104,117,131,109,88,76],
 realIdx:8 /* indices 0..8 = réalisé (fonctionnel), 9..11 = prévisionnel */
};

const PRO_TREE=[
 {dom:"Expertise comptable",n:2,pros:[
   {n:"Cabinet Durand & Associés",r:"Expert-comptable · CAC",dispo:"Sous 48h",init:"DA"},
   {n:"Cabinet Novéo Audit",r:"Expert-comptable",dispo:"Sous 4j",init:"NA"}]},
 {dom:"Droit des affaires",n:2,pros:[
   {n:"Me Sophie Lambert",r:"Avocate — droit des sociétés",dispo:"Sous 72h",init:"SL"},
   {n:"Me Karim Benali",r:"Avocat — contrats & contentieux",dispo:"Sous 5j",init:"KB"}]},
 {dom:"Fiscalité",n:1,pros:[
   {n:"Cabinet FiscaConseil",r:"Fiscaliste",dispo:"Sous 5j",init:"FC"}]},
 {dom:"Paie & social",n:1,pros:[
   {n:"PaieExpert Services",r:"Gestionnaire paie / DSN",dispo:"Sous 48h",init:"PE"}]},
 {dom:"Financement & DAF externe",n:1,pros:[
   {n:"Hélène Roux",r:"DAF externalisée à temps partagé",dispo:"Sous 1 sem.",init:"HR"}]}];

/* ---------- state ---------- */
const state={onboarded:false,page:"dash",obStep:0,siren:"",
 cashSel:null,cashZoom:0, /* 0 = 12 mois, +1 = zoom (moins de mois) */
 openTree:{corp:true,biz:false,rh:false},openDom:{},
 apptPro:null,apptSlot:null,
 chat:[
  {role:"ia",t:"Bonjour. Je surveille en continu votre dossier : échéances, trésorerie, contrats, paie, et je fais une veille juridique, fiscale, sectorielle et comptable. Je vous alerte et je vous propose des scénarios. Les sujets réglementés sont orientés vers un professionnel."},
  {role:"user",t:"Pourquoi ma trésorerie baisse à partir de décembre ?"},
  {role:"ia",t:"Sur la période prévisionnelle (déc.→févr.), vos décaissements passent de ~53 k€ à ~92 k€/mois tandis que les encaissements progressent moins vite. Résultat : le solde recule de 131 k€ à 76 k€. Deux leviers : étaler un décaissement fournisseur, ou activer une ligne court terme.",src:"Source : relevés bancaires · échéancier fournisseurs · confiance 88% · simulation à valider"}]};

/* ---------- screens ---------- */
function screenDash(){return `
 ${sectionTitle("Tableau de bord","Vue d'ensemble — le copilote surveille, anticipe et propose. Données de démonstration.")}

 ${ai({sev:C.red,kind:"Alerte prioritaire",
   title:"Risque de trésorerie détecté sur mars",
   body:"En croisant votre échéancier fournisseurs et le <b>1er acompte d'IS (≈ 4 250 €, estimatif)</b> du 15 mars, le solde projeté tombe à <b>8 400 € en semaine 6</b>. Un encaissement client ACME de 12 000 € est attendu — mais après la date critique.",
   scenarios:[
     {h:"Décaler l'acompte via échéancier",pro:["Préserve la trésorerie de mars","Démarche en ligne, rapide"],con:["Majoration possible si retard non encadré","Ne règle pas le fond"]},
     {h:"Affacturage facture ACME",pro:["Cash disponible avant l'échéance","Sécurise le mois"],con:["Coût de financement (~1,5 %)","Contrat à mettre en place"]}],
   reco:"Relancer ACME dès maintenant (échéance au 20 fév.) ; si non réglé au 5 mars, activer l'affacturage plutôt que décaler l'IS.",
   cta:[{t:"Ouvrir la trésorerie",p:1,act:"nav('cash')"},{t:"Voir l'échéance IS",act:"nav('calendar')"}],
   src:"Croisement : relevés bancaires · échéancier · calendrier fiscal · confiance 88%"})}

 <div class="grid-auto" style="margin-top:16px">
  <div class="card clickable" onclick="nav('cash')">
   <div style="font-size:13px;color:${C.slate};font-weight:600">Trésorerie disponible</div>
   <div style="font-size:30px;font-weight:800;color:${C.navy};margin:4px 0">131 200 €</div>
   ${spark(CASH.sol,220,54)}
   <div style="font-size:12px;color:${C.red};margin-top:4px;font-weight:600">▼ Prévision : 76 k€ à fin février</div>
  </div>
  <div class="card clickable" onclick="nav('calendar')">
   <div style="font-size:13px;color:${C.slate};font-weight:600;margin-bottom:10px">Prochaines échéances</div>
   ${ECHEANCES.filter(e=>true).slice(0,4).map((e,i,arr)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${i<arr.length-1?`border-bottom:1px solid ${C.line}`:""}">
     <span style="font-size:13px;color:${C.ink}">${esc(e.t.length>22?e.t.slice(0,22)+"…":e.t)}${e.montant?` <span style="color:${e.mt==="réel"?C.slate:C.gold};font-weight:600">· ${e.montant}</span>`:""}</span>
     <span style="font-size:12px;color:${isOverdue(e.iso)?C.red:statutColor[e.statut]};font-weight:600">${frDate(e.iso)}</span></div>`).join("")}
  </div>
  <div class="card clickable" onclick="nav('factures')">
   <div style="font-size:13px;color:${C.slate};font-weight:600;margin-bottom:8px">Préparation e-facture</div>
   <div style="display:flex;align-items:center;gap:14px">${donut(65)}<div style="font-size:12px;color:${C.slate}">Prêt pour la <b style="color:${C.ink}">réception obligatoire du 1er sept. 2026</b></div></div>
  </div>
  <div class="card clickable" onclick="nav('actions')">
   <div style="font-size:13px;color:${C.slate};font-weight:600;margin-bottom:10px">Actions prioritaires</div>
   ${ACTIONS.slice(0,3).map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0"><span class="dot" style="background:${statutColor[a.statut]};margin-top:5px;flex-shrink:0"></span><span style="font-size:13px;color:${C.ink}">${esc(a.t)}</span></div>`).join("")}
  </div>
 </div>

 <div style="margin-top:24px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
   ${sparkSvg(C.navy)}<h3 class="serif" style="font-size:18px;color:${C.navy}">Veille intelligente</h3>
   <span style="font-size:12px;color:${C.slate}">— surveillance continue de ce qui vous concerne</span>
 </div>
 <div class="grid-auto">
  ${[

function visibleCash(){
 const start=state.cashZoom>0?Math.min(state.cashZoom*3,8):0;
 const idx=[];for(let i=start;i<12;i++)idx.push(i);return idx;
}
function cashChart(){
 const idx=visibleCash();
 const W=640,H=280,padL=48,padB=34,padT=14,padR=14;
 const plotW=W-padL-padR,plotH=H-padT-padB;
 const maxV=Math.max(...CASH.ent,...CASH.sor,...CASH.sol)*1.12;
 const yOf=v=>padT+plotH-(v/maxV)*plotH;
 const n=idx.length,band=plotW/n;
 const cx=k=>padL+band*(k+0.5);
 /* axes y */
 let gy="";const ticks=5;
 for(let t=0;t<=ticks;t++){const v=maxV*t/ticks;const y=yOf(v);
  gy+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${C.line}" stroke-width="1"/>
       <text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="${C.slate}">${Math.round(v)}k€</text>`;}
 /* barres entrées/sorties */
 let bars="";
 idx.forEach((gi,k)=>{const bw=band*0.22;const c=cx(k);
  const eH=(CASH.ent[gi]/maxV)*plotH,sH=(CASH.sor[gi]/maxV)*plotH;
  const real=gi<=CASH.realIdx;
  bars+=`<rect x="${(c-bw-2).toFixed(1)}" y="${yOf(CASH.ent[gi]).toFixed(1)}" width="${bw}" height="${eH.toFixed(1)}" rx="2" fill="${C.blue}" opacity="${real?.55:.28}"/>`;
  bars+=`<rect x="${(c+2).toFixed(1)}" y="${yOf(CASH.sor[gi]).toFixed(1)}" width="${bw}" height="${sH.toFixed(1)}" rx="2" fill="${C.red}" opacity="${real?.5:.26}"/>`;
 });
 /* ligne solde : réalisé (plein, vert) + prévisionnel (pointillé, gold) */
 const ptStr=i=>`${cx(i).toFixed(1)},${yOf(CASH.sol[idx[i]]).toFixed(1)}`;
 let realPts=[],fcPts=[];
 idx.forEach((gi,k)=>{ (gi<=CASH.realIdx?realPts:fcPts).push(ptStr(k)); });
 /* raccord : dernier point réalisé rejoint le 1er prévisionnel */
 const lastRealK=idx.filter(gi=>gi<=CASH.realIdx).length-1;
 let joinLine="";
 if(lastRealK>=0 && lastRealK<n-1){joinLine=`<line x1="${cx(lastRealK).toFixed(1)}" y1="${yOf(CASH.sol[idx[lastRealK]]).toFixed(1)}" x2="${cx(lastRealK+1).toFixed(1)}" y2="${yOf(CASH.sol[idx[lastRealK+1]]).toFixed(1)}" stroke="${C.gold}" stroke-width="2.5" stroke-dasharray="5 4"/>`;}
 const lineReal=realPts.length>1?`<polyline points="${realPts.join(" ")}" fill="none" stroke="${C.green}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`:"";
 const lineFc=fcPts.length>1?`<polyline points="${fcPts.join(" ")}" fill="none" stroke="${C.gold}" stroke-width="2.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>`:"";
 /* points interactifs + labels x */
 let pts="",xl="";
 idx.forEach((gi,k)=>{const c=cx(k),y=yOf(CASH.sol[gi]);const real=gi<=CASH.realIdx;const sel=state.cashSel===gi;
  pts+=`<circle cx="${c.toFixed(1)}" cy="${y.toFixed(1)}" r="${sel?6:4.5}" fill="${real?C.green:C.gold}" stroke="#fff" stroke-width="2" style="cursor:pointer"
    onmouseenter="cashTip(event,${gi})" onmousemove="cashTip(event,${gi})" onmouseleave="cashHide()" onclick="cashPick(${gi})"/>`;
  xl+=`<text x="${c.toFixed(1)}" y="${H-padB+16}" text-anchor="middle" font-size="10" fill="${C.slate}">${CASH.lab[gi]}</text>
       <text x="${c.toFixed(1)}" y="${H-padB+27}" text-anchor="middle" font-size="9" fill="${C.line===C.line?C.slate:C.slate}">'${CASH.yr[gi]}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
   ${gy}${bars}${lineReal}${joinLine}${lineFc}${pts}${xl}
   <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="${C.slate}" stroke-width="1"/>
   <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="${C.slate}" stroke-width="1"/>
  </svg>`;
}

  ${open?d.pros.map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 16px 11px 40px;border-bottom:1px solid ${C.line};background:#fbfcfe">
    <div class="avatar">${p.init}</div>
    <div style="flex:1"><div style="font-size:14px;color:${C.ink};font-weight:600">${esc(p.n)}</div><div style="font-size:12px;color:${C.slate}">${esc(p.r)}</div></div>
    ${badge(p.dispo,C.green)}
    <button class="btn btn-primary btn-xs" onclick="event.stopPropagation();pickPro('${esc(p.n)}')">Rendez-vous</button>
   </div>`).join(""):""}`;}
function screenDataroom(){

 ${sectionTitle("Data room & professionnels","Partage volontaire, limité et révocable — vous choisissez chaque document")}
 ${ai({sev:C.navy2,kind:"Suggestion de routage",title:"Un avocat en droit des affaires est recommandé",
   body:"La clause de responsabilité du contrat BÉTA sort de vos usages habituels. Le copilote suggère Me Sophie Lambert (droit des sociétés, dispo sous 72h) et a préparé la sélection de documents à partager.",
   cta:[{t:"Voir le dossier BÉTA"},{t:"Prendre rendez-vous",p:1,act:"pickPro('Me Sophie Lambert')"}]})}
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px" class="grid-2">
  <div class="card" style="padding:0">
   <div style="padding:14px 16px;font-size:14px;font-weight:700;color:${C.navy};border-bottom:1px solid ${C.line}">Réseau de professionnels par domaine</div>
   ${PRO_TREE.map((d,i)=>domFolder(d,i)).join("")}
  </div>
  <div class="card">
   <div style="font-size:14px;font-weight:700;color:${C.navy};margin-bottom:12px">Prise de rendez-vous</div>
   ${state.apptPro?`
     <div style="font-size:13px;color:${C.slate};margin-bottom:10px">Professionnel : <b style="color:${C.ink}">${esc(state.apptPro)}</b></div>
     <div style="font-size:12px;font-weight:700;color:${C.slate};text-transform:uppercase;margin-bottom:8px">Créneaux disponibles</div>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${slots.map((s,k)=>`<div class="slot ${state.apptSlot===k?"sel":""}" onclick="pickSlot(${k})">${s}</div>`).join("")}</div>
     <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" ${state.apptSlot===null?"disabled style=opacity:.5":""} onclick="confirmAppt()">Confirmer le rendez-vous</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelAppt()">Changer</button>
     </div>
     ${state.apptSlot!==null?`<div style="margin-top:10px;font-size:12px;color:${C.green}">✓ Documents partagés : le copilote joindra le dossier BÉTA (partage limité à 7 jours, révocable).</div>`:""}
   `:`
     <div style="padding:16px;background:${C.bg};border-radius:10px;text-align:center">
      <div style="font-size:14px;color:${C.ink};font-weight:600">Sélectionnez un professionnel</div>
      <div style="font-size:12px;color:${C.slate};margin:6px 0">Choisissez un domaine à gauche puis « Rendez-vous » pour ouvrir un créneau et une salle de décision.</div>
     </div>
   `}
   <div style="margin-top:14px;font-size:12px;color:${C.slate}">🔒 Chaque partage est limité dans le temps, révocable, et journalisé (qui a vu quoi, quand). Aucune commission sur les honoraires du professionnel.</div>
  </div>
 </div>`;
}

function screenAssistant(){return `
 ${sectionTitle("Assistant IA","Réponses sourcées, à périmètre restreint — jamais un conseil réglementé autonome")}
 <div style="display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px">
  ${ai({sev:C.blue,kind:"Le copilote a repéré 3 choses aujourd'hui",
   body:"1) Trésorerie sous tension en février (−55 k€). 2) TVA de décembre en retard (3 420 €). 3) Contrat BÉTA à faire relire par un avocat. Cliquez pour agir.",
   cta:[{t:"Trésorerie",act:"nav('cash')"},{t:"Calendrier",act:"nav('calendar')"},{t:"Data room",act:"nav('dataroom')"}]})}
 </div>
 <div class="card" style="padding:0;overflow:hidden">
  <div style="background:${C.ice}44;padding:8px 16px;font-size:12px;color:${C.navy}">Vous interagissez avec une IA. Les analyses sont préparatoires et à valider ; les sujets réglementés sont orientés vers un professionnel.</div>
  <div id="chatbox" style="padding:20px;max-height:340px;overflow-y:auto">
   ${state.chat.map(m=>`<div style="display:flex;justify-content:${m.role==="user"?"flex-end":"flex-start"};margin-bottom:14px"><div style="max-width:75%;background:${m.role==="user"?C.navy:C.bg};color:${m.role==="user"?"#fff":C.ink};padding:10px 14px;border-radius:12px;font-size:14px">${esc(m.t)}${m.src?`<div style="font-size:11px;color:${m.role==="user"?C.ice:C.slate};margin-top:6px;border-top:1px solid ${m.role==="user"?"#ffffff33":C.line};padding-top:6px">${esc(m.src)}</div>`:""}</div></div>`).join("")}
  </div>
  <div style="display:flex;gap:8px;padding:16px;border-top:1px solid ${C.line}">
   <input id="chatInput" class="field" style="flex:1" placeholder="Posez une question sur votre dossier…" onkeydown="if(event.key==='Enter')sendChat()"/>
   <button class="btn btn-primary" onclick="sendChat()">Envoyer</button>
  </div>
 </div>`;}

const SCREENS={dash:screenDash,actions:screenActions,calendar:screenCalendar,cash:screenCash,docs:screenDocs,factures:screenFactures,dataroom:screenDataroom,assistant:screenAssistant};

/* ---------- onboarding (SIREN + TVA) ---------- */
function renderOnboarding(){
 const total=3;const pct=Math.round((state.obStep/total)*100);
 let inner;
 if(state.obStep===0){
  inner=`<div class="card">
   <div style="font-size:12px;color:${C.gold};font-weight:700;letter-spacing:1px">ÉTAPE 1 / ${total}</div>
   <h2 class="serif" style="color:${C.navy};font-size:22px;margin:8px 0 6px">Quel est votre numéro de SIREN ?</h2>
   <p style="color:${C.slate};font-size:13px;margin-bottom:18px">Nous récupérons automatiquement votre forme juridique et vos effectifs depuis les données publiques (SIRENE / INSEE). Vous pouvez saisir n'importe quel SIREN pour tester.</p>
   <input id="sirenInput" class="field" style="width:100%;font-size:16px;letter-spacing:2px" maxlength="11" placeholder="123 456 789" value="${esc(state.siren)}"/>
   <div style="margin-top:16px;display:flex;gap:8px">
    <button class="btn btn-primary" onclick="obSiren()">Vérifier & continuer</button>
    <button class="btn btn-ghost" onclick="obSirenDemo()">Simuler un SIREN de démo</button>
   </div>
  </div>`;
 }else if(state.obStep===1){
  inner=`<div class="card">
   <div style="font-size:12px;color:${C.gold};font-weight:700;letter-spacing:1px">ÉTAPE 2 / ${total}</div>
   <h2 class="serif" style="color:${C.navy};font-size:22px;margin:8px 0 6px">Entreprise identifiée</h2>
   <div style="background:${C.bg};border-radius:10px;padding:14px 16px;margin:12px 0">
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px"><span style="color:${C.slate}">SIREN</span><b>${esc(state.siren||"784 671 695")}</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid ${C.line}"><span style="color:${C.slate}">Dénomination</span><b>ARCAN Démo SAS</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid ${C.line}"><span style="color:${C.slate}">Forme juridique</span><b>SAS</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-top:1px solid ${C.line}"><span style="color:${C.slate}">Effectif</span><b>6 à 9 salariés</b></div>
   </div>
   <p style="color:${C.slate};font-size:12px;margin-bottom:14px">Récupéré depuis SIRENE / INSEE (données de démonstration).</p>
   <button class="btn btn-primary" onclick="obNext()">C'est correct, continuer</button>
  </div>`;
 }else if(state.obStep===2){
  const opts=["Franchise en base","Réel simplifié","Réel normal","Je ne sais pas"];
  inner=`<div class="card">
   <div style="font-size:12px;color:${C.gold};font-weight:700;letter-spacing:1px">ÉTAPE 3 / ${total}</div>
   <h2 class="serif" style="color:${C.navy};font-size:22px;margin:8px 0 20px">Quel est votre régime de TVA ?</h2>
   <div style="display:grid;gap:10px">${opts.map(o=>`<div onclick="obNext()" style="padding:14px 16px;border:1px solid ${C.line};border-radius:10px;cursor:pointer;font-size:14px;color:${C.ink}" onmouseover="this.style.borderColor='${C.navy}';this.style.background='${C.bg}'" onmouseout="this.style.borderColor='${C.line}';this.style.background='#fff'">${esc(o)}</div>`).join("")}</div>
  </div>`;
 }else{
  inner=`<div class="card" style="text-align:center"><div style="font-size:44px;color:${C.green}">✓</div><h2 class="serif" style="color:${C.navy};font-size:22px;margin:8px 0">Votre dossier est prêt</h2><p style="color:${C.slate};font-size:14px;margin-bottom:20px">Le copilote a généré votre matrice d'obligations, votre premier tableau de bord et lancé la veille juridique, fiscale, sectorielle et comptable.</p><button class="btn btn-accent" onclick="finishOnboarding()">Accéder au tableau de bord</button></div>`;
 }
 return `<div style="min-height:100vh;background:${C.bg};display:flex;flex-direction:column">
  <div style="padding:20px 32px;background:#fff;border-bottom:1px solid ${C.line}">${logo(38)}</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px">
   <div style="text-align:center;margin-bottom:30px"><h1 class="serif" style="color:${C.navy};font-size:30px;margin:0">Bienvenue sur DAF 360</h1><p style="color:${C.slate};font-size:15px">Deux informations suffisent pour configurer votre espace.</p></div>
   <div style="max-width:560px;margin:0 auto;width:100%">
    <div style="height:6px;background:${C.line};border-radius:6px;margin-bottom:28px"><div style="width:${pct}%;height:100%;background:${C.gold};border-radius:6px;transition:width .3s"></div></div>
    ${inner}
   </div>
  </div>
 </div>`;
}

/* ---------- shell ---------- */
function renderApp(){
 return `<div class="shell">
  <aside id="sidebar">
   <div style="padding:0 24px 24px">${logo(36)}</div>
   <nav>${NAV.map(n=>`<div class="nav-item ${state.page===n.id?"active":""}" onclick="nav('${n.id}')">${nicon(n.id)}${n.label}</div>`).join("")}</nav>
   <div style="margin:24px;padding:14px;background:${C.bg};border-radius:10px;font-size:12px;color:${C.slate}"><b style="color:${C.navy}">Maquette de démonstration</b><br/>Données fictives · aucune connexion réelle</div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column">
   <header class="top">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:14px;color:${C.slate}">Entité :</span><span style="font-size:14px;font-weight:600;color:${C.navy}">ARCAN Démo SAS ▾</span></div>
    <div style="display:flex;align-items:center;gap:16px"><span style="font-size:18px;cursor:pointer">🔔</span><div class="avatar">JD</div></div>
   </header>
   <main>${SCREENS[state.page]()}</main>
  </div>
 </div>`;
}

/* ---------- actions ---------- */
function render(){document.getElementById("app").innerHTML=state.onboarded?renderApp():renderOnboarding();}
function nav(p){state.page=p;render();}
function noop(){}
function obNext(){state.obStep++;render();}
function obSiren(){const el=document.getElementById("sirenInput");state.siren=(el&&el.value)||"";if(!state.siren.replace(/\s/g,"")){state.siren="784 671 695";}state.obStep=1;render();}
function obSirenDemo(){state.siren="784 671 695";state.obStep=1;render();}
function finishOnboarding(){state.onboarded=true;render();}
function toggleTree(k){state.openTree[k]=!state.openTree[k];render();}
function toggleDom(i){state.openDom[i]=!state.openDom[i];render();}
function pickPro(n){state.apptPro=n;state.apptSlot=null;state.page="dataroom";render();}
function pickSlot(k){state.apptSlot=k;render();}
function confirmAppt(){alert("Rendez-vous confirmé (démo). Une salle de décision et le partage de documents seront préparés par le copilote.");}
function cancelAppt(){state.apptPro=null;state.apptSlot=null;render();}
function cashPick(i){state.cashSel=(state.cashSel===i?null:i);render();}
function cashZoom(d){state.cashZoom=Math.max(0,Math.min(2,state.cashZoom+d));render();}
function cashTip(e,i){const el=document.getElementById("cashTip");if(!el)return;const real=i<=CASH.realIdx;
 el.innerHTML=`<div style="font-weight:700;margin-bottom:4px">${CASH.lab[i]} 20${CASH.yr[i]} — ${real?"réalisé":"prévisionnel"}</div>
  Solde : <b>${CASH.sol[i]} k€</b><br/>Encaissements : ${CASH.ent[i]} k€<br/>Décaissements : ${CASH.sor[i]} k€`;
 el.style.display="block";el.style.left=(e.clientX+14)+"px";el.style.top=(e.clientY-10)+"px";}
function cashHide(){const el=document.getElementById("cashTip");if(el)el.style.display="none";}
function sendChat(){
 const el=document.getElementById("chatInput");const v=(el.value||"").trim();if(!v)return;
 state.chat.push({role:"user",t:v});
 state.chat.push({role:"ia",t:"Ceci est une maquette : la réponse réelle serait sourcée, accompagnée d'un score de confiance et, si le sujet est réglementé, orientée vers le professionnel adapté avec proposition de scénarios."});
 render();
 const box=document.getElementById("chatbox");if(box)box.scrollTop=box.scrollHeight;
 const ni=document.getElementById("chatInput");if(ni)ni.focus();
}
render();
</script>
</body>
</html>
