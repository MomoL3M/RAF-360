name: CI

on:
  push:
    branches: [ main, master ]
  pull_request: ~

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité & tests
    runs-on: ubuntu-latest

    # Les tests fonctionnels (droits RGPD, parcours) écrivent en base : sans PostgreSQL
    # ici, la CI ne pourrait vérifier que du code sans effet (§24).
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8"

    steps:
      - uses: actions/checkout@v7

      - name: Configurer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, gd, sodium
          tools: composer:v2
          coverage: none

      - name: Valider composer.json / composer.lock
        run: composer validate --strict

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Contrôle du style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Contrôle des gabarits Twig
        run: php bin/console lint:twig templates --env=test

      - name: Préparer la base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Vérifier que le schéma correspond au mapping
        run: php bin/console doctrine:schema:validate --env=test

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit

      # Le test de fumée est joué ici sur un serveur local : il vérifie que les pages
      # clés répondent ET affichent le bon contenu, sur une installation partie de zéro.
      # C'est le même script que celui lancé après un déploiement (§23.2).
      - name: Test de fumée
        run: |
          # php -S reconstruit $_SERVER à chaque requête : les variables du job n'y
          # survivent pas (l'application repartirait sur les valeurs du .env, donc sur
          # la mauvaise base). On les pose dans .env.local, lu quel que soit l'environnement.
          printf 'APP_ENV=test\nDATABASE_URL="%s"\n' "$DATABASE_URL" > .env.local
          php -S 127.0.0.1:8000 -t public >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          ./bin/test-de-fumee.sh http://127.0.0.1:8000
          rm -f .env.local

      - name: Audit de sécurité des dépendances PHP
        run: composer audit

      - name: Audit de sécurité des dépendances JavaScript (importmap)
        run: php bin/console importmap:audit
